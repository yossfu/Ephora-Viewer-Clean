name: EPHORA APK 7.73
on:
  push:
    branches: [ main, "ephora-7.73-genshin-fix" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: SDK+NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1"
          if [ ! -f "$ANDROID_HOME/ndk/27.0.12077973/source.properties" ]; then
            sdkmanager "ndk;27.0.12077973"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: EPHORASL-7.73-Genshin-Fix-debug
          path: app/build/outputs/apk/debug/*.apk
