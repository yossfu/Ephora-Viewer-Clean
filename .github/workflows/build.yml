name: Build Ephora Viewer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Clean source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Native self-test
        run: |
          c++ -std=c++17 -O1 -Wall -Wextra -fno-exceptions -fno-rtti \
            -Iapp/src/main/cpp \
            app/src/main/cpp/sl_prim_geometry.cpp app/src/main/cpp/slcore_tests.cpp \
            -o /tmp/slcore_tests
          /tmp/slcore_tests

      - name: Configure Gradle project
        run: gradle :app:tasks --no-daemon --console=plain

      - name: Build debug and release APK
        run: |
          set -e
          gradle :app:externalNativeBuildDebug --no-daemon --console=plain --stacktrace
          gradle assembleDebug --no-daemon --console=plain --stacktrace
          gradle assembleRelease --no-daemon --console=plain --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ephora-viewer-clean-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ephora-viewer-clean-release-apk
          path: app/build/outputs/apk/release/*.apk
