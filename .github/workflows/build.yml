name: EPHORASL Android APK

on:
  push:
    branches: [main, ephora-7.74-real-sl-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK, NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Fetch Second Life system avatar resources
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/Kaleaon/Linkpoint/7a5438152bd83e46eef6f2a0b69447118db7e40b/disassembled-apps/second-life-2025.12.1075/extracted-resources/assets/Avatar"
          mkdir -p app/src/main/assets/avatar
          for f in avatar_head.llm avatar_upper_body.llm avatar_lower_body.llm avatar_eye.llm avatar_eyelashes.llm avatar_skeleton.xml; do
            curl --fail --location --retry 3 --silent --show-error "$BASE/$f" -o "app/src/main/assets/avatar/$f"
          done
          cat > app/src/main/assets/avatar/THIRD_PARTY_NOTICE.txt <<'EOF'
Ephora uses the legacy Linden Binary Mesh (.llm) system-avatar resources
obtained from the open-source Linkpoint project for local viewer functionality.
Linkpoint source is distributed under the MIT License. These resources are
used solely as viewer data for rendering the Second Life system avatar.
Second Life and Linden Lab are trademarks of Linden Research, Inc.
EOF
          ls -lh app/src/main/assets/avatar

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: EPHORASL-7.74-REAL-SL-REBUILD-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Package source snapshot
        run: git archive --format=zip --output=Ephora-SL-7.74-REAL-SL-REBUILD-SOURCE.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: EPHORASL-7.74-REAL-SL-REBUILD-source
          path: Ephora-SL-7.74-REAL-SL-REBUILD-SOURCE.zip
