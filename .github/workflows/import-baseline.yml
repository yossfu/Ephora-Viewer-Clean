name: Import exact Ephora baseline and build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4

      - name: Import exact source commit
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_REPO="https://github.com/yossfu/Ephora-Viewer.git"
          SOURCE_COMMIT="e990ac334dad60b91fa9c3d881bc6b081997e5fa"

          git clone --quiet "$SOURCE_REPO" /tmp/ephora-source
          cd /tmp/ephora-source
          git checkout --quiet "$SOURCE_COMMIT"
          rm -rf .git
          # Clean's Actions token cannot replace workflows; this repo keeps its own importer.
          rm -rf .github

          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/ephora-source/. .
          rm -rf /tmp/ephora-source

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A

          if git diff --cached --quiet; then
            echo "Nothing to import."
          else
            git commit -m "Import exact Ephora baseline e990ac3"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Environment inventory
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- ndk ---"; ls -1 "$ANDROID_HOME/ndk" 2>&1 || true
          echo "--- cmake ---"; ls -1 "$ANDROID_HOME/cmake" 2>&1 || true
          test -d "$ANDROID_HOME/ndk/26.1.10909125"
          test -d "$ANDROID_HOME/cmake/3.22.1"

      - name: Native self-test
        run: |
          c++ -std=c++17 -O1 -Wall -Wextra -fno-exceptions -fno-rtti \
            -Iapp/src/main/cpp \
            app/src/main/cpp/sl_prim_geometry.cpp app/src/main/cpp/slcore_tests.cpp \
            -o /tmp/slcore_tests
          /tmp/slcore_tests

      - name: Configure Gradle project
        run: gradle :app:tasks --no-daemon --console=plain

      - name: Build debug and release APK
        run: |
          set -e
          gradle :app:externalNativeBuildDebug --no-daemon --console=plain --stacktrace
          gradle assembleDebug --no-daemon --console=plain --stacktrace
          gradle assembleRelease --no-daemon --console=plain --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ephora-viewer-clean-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ephora-viewer-clean-release-apk
          path: app/build/outputs/apk/release/*.apk
