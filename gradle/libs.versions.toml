[versions]
agp = "8.7.2"
kotlin = "2.0.21"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
recyclerview = "1.3.2"
activity = "1.9.3"
lifecycle = "2.8.7"
coroutines = "1.9.0"
# IMPORTANTE: no subir Filament sin comprobar el `minCompileSdk` de sus AAR.
# 1.76.0/1.76.1/1.77.0 exigen compileSdk 37 (y traen bytecode de Java 21), lo que
# rompe `:app:checkDebugAarMetadata` en este proyecto, que compila contra API 35
# y genera Java 17. 1.75.1 es la ultima version cuyo aar-metadata no impone nada
# y cuyas clases son de Java 17. Para subir de version hay que subir antes
# compileSdk (y el `platforms;android-XX` de CI) o usar una version que lo permita:
#   unzip -p filament-android-<v>.aar META-INF/com/android/build/gradle/aar-metadata.properties
filament = "1.75.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
filament-android = { group = "com.google.android.filament", name = "filament-android", version.ref = "filament" }
filament-filamat = { group = "com.google.android.filament", name = "filamat-android", version.ref = "filament" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
